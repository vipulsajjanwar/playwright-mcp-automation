# =============================================================================
# TEST AUTOMATION FRAMEWORK - DEFAULT CONFIGURATION
# =============================================================================
# Secrets (usernames, passwords, API keys) are NOT stored here.
# Keep them in the .env files. Keys expected in .env:
#   db.username, db.password
#   email.smtp.username, email.smtp.password
#   elk.username, elk.password
#   ai.apiKey
# =============================================================================


# =============================================================================
# 1. ENVIRONMENT & APPLICATION UNDER TEST
# =============================================================================
env=qa
baseUrl=


# =============================================================================
# 2. BROWSER
# =============================================================================
browser=chrome
headless=false
slowMo=0


# =============================================================================
# 3. TIMEOUTS (milliseconds)
# =============================================================================
timeout=30000
navigationTimeout=60000


# =============================================================================
# 4. DATE & TIME
# =============================================================================
time.format=yyyy-MM-dd HH:mm:ss
time.zone=Asia/Kolkata
timestamp.format=yyyyMMdd_HHmmss_SSS


# =============================================================================
# 5. FAILURE EVIDENCE: TRACE, SCREENSHOT, VIDEO
# =============================================================================
# --- Trace ---
trace.enabled=true
trace.onFailure=true
trace.keepOnPass=false

# --- Screenshot ---
screenshot.onFailure=true
screenshot.onStep=false

# --- Video ---
video.enabled=true
video.onFailure=true


# =============================================================================
# 6. RETRY
# =============================================================================
retry.enabled=true
retry.count=1


# =============================================================================
# 7. API
# =============================================================================
api.baseUrl=https://jsonplaceholder.typicode.com
api.timeout=10000


# =============================================================================
# 8. DATABASE
# =============================================================================
db.driver=org.h2.Driver
db.url=jdbc:postgresql://hostname:5432/postgres
# db.username -> defined in .env
# db.password -> defined in .env


# =============================================================================
# 9. AI
# =============================================================================
ai.provider=mock
ai.model=
ai.apiKeyEnv=AI_API_KEY
ai.timeoutSeconds=60
ai.maxConcurrentRequests=2
ai.replan=false
ai.healWriteBack=false
ai.allowedHosts=app.example.com,api.example.com,jsonplaceholder.typicode.com,reqres.in,qaplayground.com
ai.locatorAnalyzer.enabled=true
ai.failureAnalyzer.enabled=true

# =============================================================================
# 10. PROMPT-DRIVEN TESTING
# =============================================================================
prompts.dir=src/test/resources/prompts
prompts.threads=1
prompts.strict=false
prompts.screenshots=failures
prompts.maxSteps=60
prompts.stepTimeoutMs=30000
prompts.testTimeoutMinutes=10

# =============================================================================
# 11. MCP
# =============================================================================
mcp.enabled=true
mcp.serverPort=8080


# =============================================================================
# 11. EMAIL NOTIFICATION
# =============================================================================
email.enabled=false

# --- SMTP server ---
email.smtp.host=smtp.office365.com
email.smtp.port=587
# email.smtp.username -> defined in .env
# email.smtp.password -> defined in .env

# --- Recipients ---
email.to=
email.cc=
email.bcc=

# --- Content ---
email.subject=Test Automation Report
email.body=Please find the attached test report.
email.message=This is an automated email sent from the test framework.
email.signature=Best regards, Test Automation


# =============================================================================
# 12. REPORTING & OBSERVABILITY
# =============================================================================
# --- Report targets ---
reporting.extent=true
reporting.allure=false
reporting.chaintest=false
reporting.elk=false
reporting.database=false
reporting.console=true

# --- Attachments included in reports ---
reporting.screenshot.on.failure=true
reporting.video.on.failure=true
reporting.trace.on.failure=true

# --- Async publishing ---
reporting.async.elk=true
reporting.async.database=true

# --- Extent ---
extent.type=html

# --- ChainTest ---
chaintest.enabled=true

# --- Allure Report & History Management ---
allure.enabled=true
allure.history.enabled=true
allure.base.path=reports/allure
allure.auto.generate=true


# =============================================================================
# 13. ELK STACK
# =============================================================================
# --- Elasticsearch ---
elk.enabled=false
elk.host=localhost
elk.port=9200
elk.index=test-automation
# elk.username -> defined in .env
# elk.password -> defined in .env

# --- Kibana ---
kibana.port=5601