# Framework Configuration Defaults
env=qa
browser=chromium
headless=true
slowMo=0
baseUrl=https://demo.playwright.dev/todomvc/
timeout=30000
navigationTimeout=60000

# Tracing & Screenshots
trace.enabled=true
trace.onFailure=true
trace.keepOnPass=false

screenshot.onFailure=true
screenshot.onStep=false

video.enabled=false
video.onFailure=true

# Retries
retry.enabled=true
retry.count=1

# API Config
api.baseUrl=https://jsonplaceholder.typicode.com
api.timeout=10000

# Database Config
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
db.username=sa
db.password=

# AI Config
ai.provider=mock
ai.model=gpt-4o-mini
ai.apiKey=
ai.locatorAnalyzer.enabled=true
ai.failureAnalyzer.enabled=true

# MCP Config
mcp.enabled=true
mcp.serverPort=8080
