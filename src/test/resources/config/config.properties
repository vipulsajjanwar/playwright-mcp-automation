# Framework Configuration Defaults
env=qa
browser=chrome
headless=false
slowMo=0
baseUrl=https://192.168.100.113:32222/
timeout=30000
navigationTimeout=60000

# Time constant
time.format=yyyy-MM-dd HH:mm:ss
time.zone=Asia/Kolkata
timestamp.format=yyyyMMdd_HHmmss_SSS

# Tracing & Screenshots
trace.enabled=true
trace.onFailure=true
trace.keepOnPass=true

screenshot.onFailure=true
screenshot.onStep=false

video.enabled=true
video.onFailure=true

# Retries
retry.enabled=true
retry.count=1

# API Config
api.baseUrl=https://jsonplaceholder.typicode.com
api.timeout=10000

# Database Config
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
db.username=sa
db.password=

# AI Config
ai.provider=mock
ai.model=gpt-4o-mini
ai.apiKey=
ai.locatorAnalyzer.enabled=true
ai.failureAnalyzer.enabled=true

# MCP Config
mcp.enabled=true
mcp.serverPort=8080

# Email Config
email.enabled=false
email.smtp.host=smtp.office365.com
email.smtp.port=587
email.smtp.username=
email.smtp.password=

email.to=vipul.s@icedq.ai
email.cc=
email.bcc=
email.subject=Test Automation Report
email.body=Please find the attached test report.
email.message=This is an automated email sent from the test framework.
email.signature=Best regards, Test Automation

# Central Reporting & Observability Configuration
reporting.extent=true
reporting.allure=true
reporting.chaintest=true
reporting.elk=true
reporting.database=false
reporting.console=true

reporting.screenshot.on.failure=true
reporting.video.on.failure=true
reporting.trace.on.failure=true
reporting.async.elk=true
reporting.async.database=true

# Allure Report Config
#allure.enabled=true

# Extent Report Config
extent.type=html

# Chaintest Config
chaintest.enabled=true

# ELK Stack Config
elk.enabled=false
elk.host=192.168.102.37
elk.port=9200
elk.username=elastic
elk.password=elastic
elk.index=test-automation
kibana.port=5601



